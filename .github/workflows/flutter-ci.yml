name: Shared Flutter CI

on:
  push:
    branches: ["main", "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-flutter-ci:
    name: Shared Flutter CI (pinned reusable workflow)
    uses: TomasThrawat/hyouka-flutter-workflows/.github/workflows/flutter-ci.yml@92cded954be5653a48fada29e926e4a3e4f402b7
    permissions:
      actions: read
      contents: read
      pull-requests: read
      id-token: write
      attestations: write
    with:
      flutter-channel: stable
      flutter-version: ""
      run-analyze: true
      run-tests: true
      run-screenshot-tests: true
      generate-coverage-report: true
      # The shared workflow builds one default APK. This project has two
      # product flavors, so the flavor-specific release builds below stay local.
      check-format: false
      build-apk: false
      target-platform: android-arm64
      generate-android: false
      android-project-name: nintendo_nes
      android-organization: com.tomastharwat
      run-emulator-tests: false
      emulator-api-level: 35
      run-security-audit: true
      fail-on-security-findings: false
      enable-targeted-pr-tests: false
      run-apk-smoke-test: false
      min-coverage-percent: 0
      max-apk-size-mb: 0
      max-apk-entry-size-mb: 0
      forbid-permissions: ""
      fail-on-new-warnings: false
      generate-artifact-attestation: false

  build-role-apks:
    name: Build and inspect receiver/controller APKs
    needs: [shared-flutter-ci]
    if: ${{ needs.shared-flutter-ci.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      GIT_CONFIG_COUNT: 2
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
      GIT_CONFIG_KEY_1: advice.defaultBranchName
      GIT_CONFIG_VALUE_1: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Show toolchain
        run: flutter --version

      - name: Test shared CI helper scripts
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Generate Android files, permissions, and app roles
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            flutter create . --platforms=android --org=com.tomastharwat --project-name=nintendo_nes
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET" />'
          if permission not in content:
              content = re.sub(
                  r'(<manifest\b[^>]*>)',
                  r'\1\n    ' + permission,
                  content,
                  count=1,
              )
          content, count = re.subn(
              r'(android:label=")[^"]+(")',
              r'\1__APP_NAME_PLACEHOLDER__\2',
              content,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not make the launcher label flavor-specific.")
          if 'android.permission.INTERNET' not in content:
              raise SystemExit("Missing INTERNET permission needed for local UDP.")
          content = content.replace("__APP_NAME_PLACEHOLDER__", "${appName}")
          features = [
              '    <uses-feature android:name="android.software.leanback" android:required="false" />',
              '    <uses-feature android:name="android.hardware.touchscreen" android:required="false" />',
              '    <uses-feature android:name="android.hardware.faketouch" android:required="false" />',
          ]
          for feature in features:
              feature_name = re.search(r'android:name="([^"]+)"', feature).group(1)
              if f'android:name="{feature_name}"' not in content:
                  content = re.sub(r'(<manifest\b[^>]*>)', r'\1\n' + feature, content, count=1)
          application_match = re.search(r'<application\b[^>]*>', content, re.S)
          if not application_match:
              raise SystemExit("Could not find the Android application element.")

          application_tag = application_match.group(0)
          def set_android_attribute(tag, name, value):
              pattern = r'(\bandroid:' + re.escape(name) + r'=")[^"]*(")'
              if re.search(pattern, tag):
                  return re.sub(pattern, lambda match: match.group(1) + value + match.group(2), tag, count=1)
              return tag[:-1] + ' android:' + name + '="' + value + '">'

          # Replace existing icon values to avoid duplicate XML attributes.
          application_tag = set_android_attribute(application_tag, "banner", "@drawable/tv_banner")
          application_tag = set_android_attribute(application_tag, "icon", "${appIcon}")
          application_tag = set_android_attribute(application_tag, "roundIcon", "${appRoundIcon}")
          content = content[:application_match.start()] + application_tag + content[application_match.end():]
          activity_match = re.search(r'<activity\b[^>]*android:name="\.MainActivity"[^>]*>', content, re.S)
          if not activity_match:
              raise SystemExit("Could not locate Flutter MainActivity for TV launch configuration.")
          activity_tag = activity_match.group(0)
          if "android:screenOrientation=" not in activity_tag:
              changed_tag = activity_tag[:-1] + ' android:screenOrientation="${appOrientation}">'
              content = content.replace(activity_tag, changed_tag, 1)
          activity_match = re.search(
              r'(<activity\b[^>]*android:name="\.MainActivity"[^>]*>[\s\S]*?</activity>)',
              content,
              re.S,
          )
          if not activity_match:
              raise SystemExit("Could not inspect Flutter MainActivity intent filters.")
          activity_block = activity_match.group(1)
          if "android.intent.category.LEANBACK_LAUNCHER" not in activity_block:
              activity_block, category_count = re.subn(
                  r'(<category\b[^>]*android:name="android\.intent\.category\.LAUNCHER"[^>]*/>)',
                  r'\1\n                    <category android:name="android.intent.category.LEANBACK_LAUNCHER" />',
                  activity_block,
                  count=1,
              )
              if category_count != 1:
                  raise SystemExit("Could not add LEANBACK_LAUNCHER to MainActivity.")
              content = content.replace(activity_match.group(1), activity_block, 1)
          manifest.write_text(content)

          banner = Path("android/app/src/main/res/drawable/tv_banner.xml")
          banner.parent.mkdir(parents=True, exist_ok=True)
          banner.write_text("""<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="320dp"
              android:height="180dp"
              android:viewportWidth="320"
              android:viewportHeight="180">
              <path android:fillColor="#000000" android:pathData="M0,0h320v180h-320z" />
              <path android:fillColor="#FFFFFF" android:pathData="M42,75 C42,55 58,43 78,43 L141,43 C155,43 168,53 174,69 L186,69 C192,53 205,43 219,43 L242,43 C262,43 278,59 278,79 L278,115 C278,133 257,143 243,129 L214,101 L106,101 L77,129 C63,143 42,133 42,115 Z" />
              <path android:fillColor="#000000" android:pathData="M62,71h12v34h-12z M51,82h34v12h-34z" />
              <path android:fillColor="#000000" android:pathData="M225,70a9,9 0,1 0,18 0a9,9 0,1 0,-18 0 M244,91a9,9 0,1 0,18 0a9,9 0,1 0,-18 0" />
          </vector>
          """, encoding="utf-8")

          controller_icon_source = Path("assets/controller_launcher_icon.xml")
          if not controller_icon_source.is_file():
              raise SystemExit("Controller launcher icon source is missing.")
          controller_icon = Path("android/app/src/main/res/drawable/controller_launcher_icon.xml")
          controller_icon.parent.mkdir(parents=True, exist_ok=True)
          controller_icon.write_text(controller_icon_source.read_text(encoding="utf-8"), encoding="utf-8")

          gradle = Path("android/app/build.gradle.kts")
          source = gradle.read_text()
          if 'create("receiver")' not in source:
              flavors = '''
              flavorDimensions += "role"
              productFlavors {
                  create("receiver") {
                      dimension = "role"
                      applicationId = "com.tomastharwat.nintendo_nes"
                      manifestPlaceholders["appName"] = "Nintendo NES Receiver"
                      manifestPlaceholders["appOrientation"] = "landscape"
                      manifestPlaceholders["appIcon"] = "@mipmap/ic_launcher"
                      manifestPlaceholders["appRoundIcon"] = "@mipmap/ic_launcher_round"
                  }
                  create("controller") {
                      dimension = "role"
                      applicationId = "com.tomastharwat.nes_controller"
                      manifestPlaceholders["appName"] = "NES Wi-Fi Controller"
                      manifestPlaceholders["appOrientation"] = "unspecified"
                      manifestPlaceholders["appIcon"] = "@drawable/controller_launcher_icon"
                      manifestPlaceholders["appRoundIcon"] = "@drawable/controller_launcher_icon"
                  }
              }

          '''
              marker = "    buildTypes {"
              if marker not in source:
                  raise SystemExit("Could not locate Android buildTypes block for product flavors.")
              source = source.replace(marker, flavors + marker, 1)
              gradle.write_text(source)
          if 'create("receiver")' not in source or 'create("controller")' not in source:
              raise SystemExit("Missing receiver/controller Android product flavors.")
          PY

      - name: Generate Shizuku-backed virtual gamepad receiver bridge
        run: python3 scripts/prepare_android_gamepad.py

      - name: Resolve dependencies without upgrading constraints
        run: flutter pub get

      - name: Format Dart source as in the previous project workflow
        run: dart format lib test

      - name: Check whitespace errors
        run: git diff --check

      - name: Build multi-ABI Android TV receiver and arm64 controller APKs
        shell: bash
        run: |
          set -euo pipefail
          # Build the ARM64-only controller first and preserve its APK before the multi-ABI receiver build.
          # Flutter/Gradle may otherwise retain ABI intermediates from the first flavor in the next output.
          mkdir -p ci-apks
          # Flutter may emit a fat APK when --target-platform is used without --split-per-abi.
          # Build ABI splits and keep only the controller's ARM64 APK.
          flutter build apk --release --flavor controller --target lib/controller_main.dart --target-platform android-arm64 --split-per-abi --no-pub
          test -s build/app/outputs/flutter-apk/app-arm64-v8a-controller-release.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-controller-release.apk ci-apks/app-controller-release.apk

          flutter build apk --release --flavor receiver --target lib/main.dart --target-platform android-arm,android-arm64,android-x64 --no-pub
          test -s build/app/outputs/flutter-apk/app-receiver-release.apk
          cp build/app/outputs/flutter-apk/app-receiver-release.apk ci-apks/app-receiver-release.apk

      - name: Inspect both APKs
        shell: bash
        run: |
          set -euo pipefail
          sdk="$(printenv ANDROID_SDK_ROOT || printenv ANDROID_HOME || printf '%s' /usr/local/lib/android/sdk)"
          test -d "$sdk/build-tools"
          aapt="$(find "$sdk/build-tools" -type f -name aapt -perm -u+x | sort -V | tail -n 1)"
          if [ -z "$aapt" ]; then
            echo "Android SDK aapt was not found under $sdk/build-tools"
            find "$sdk/build-tools" -maxdepth 2 -type f -name 'aapt*' -print
            exit 1
          fi
          inspect_apk() {
            local apk="$1"
            local expected_id="$2"
            local expected_label="$3"
            local role="$4"
            test -s "$apk"
            python3 - "$apk" "$expected_id" "$expected_label" "$aapt" "$role" <<'PY'
          import re
          import subprocess
          import sys
          import zipfile

          apk_path, expected_id, expected_label, aapt, role = sys.argv[1:]
          with zipfile.ZipFile(apk_path) as archive:
              names = archive.namelist()
              native = [n for n in names if n.startswith("lib/") and n.endswith(".so")]
              abis = {n.split("/")[1] for n in native}
              assert native, f"{apk_path}: APK has no native shared libraries"
          if role == "receiver":
              expected_abis = {"armeabi-v7a", "arm64-v8a", "x86_64"}
          else:
              expected_abis = {"arm64-v8a"}
          assert abis == expected_abis, (
              f"{apk_path}: expected ABIs {sorted(expected_abis)}, found {sorted(abis)}"
          )
          for abi in expected_abis:
              for required_library in ("libapp.so", "libflutter.so"):
                  assert f"lib/{abi}/{required_library}" in native, (
                      f"{apk_path}: {abi} is missing required Flutter library {required_library}"
                  )

          badging = subprocess.run(
              [aapt, "dump", "badging", apk_path],
              check=True,
              text=True,
              capture_output=True,
          ).stdout
          package = re.search(r"^package: name='([^']+)'", badging, re.M)
          labels = re.findall(r"^application-label:'([^']*)'", badging, re.M)
          assert package and package.group(1) == expected_id, (
              f"{apk_path}: unexpected package ID {package.group(1) if package else None}"
          )
          assert expected_label in labels, (
              f"{apk_path}: expected label {expected_label!r}, got {labels}"
          )
          permissions = subprocess.run(
              [aapt, "dump", "permissions", apk_path],
              check=True,
              text=True,
              capture_output=True,
          ).stdout
          assert "android.permission.INTERNET" in permissions, (
              f"{apk_path}: missing INTERNET permission"
          )
          for forbidden in (
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.ACCESS_WIFI_STATE",
              "android.permission.NEARBY_WIFI_DEVICES",
          ):
              assert forbidden not in permissions, (
                  f"{apk_path}: unnecessary permission present: {forbidden}"
              )
          if role == "receiver":
              xmltree = subprocess.run(
                  [aapt, "dump", "xmltree", apk_path, "AndroidManifest.xml"],
                  check=True,
                  text=True,
                  capture_output=True,
              ).stdout
              assert "android.intent.category.LEANBACK_LAUNCHER" in xmltree, (
                  f"{apk_path}: Android TV Leanback launcher category is missing"
              )
              assert "android.software.leanback" in xmltree, (
                  f"{apk_path}: optional Android TV Leanback feature is missing"
              )
          print(
              f"Verified {apk_path}: package={expected_id}, label={expected_label}, ABIs={sorted(abis)}"
          )
          print("Merged APK permissions:")
          print(permissions.strip())
          PY
            ls -lh "$apk"
          }
          inspect_apk "ci-apks/app-receiver-release.apk" "com.tomastharwat.nintendo_nes" "Nintendo NES Receiver" receiver
          inspect_apk "ci-apks/app-controller-release.apk" "com.tomastharwat.nes_controller" "NES Wi-Fi Controller" controller

      - name: Upload receiver and controller APKs
        uses: actions/upload-artifact@v7
        with:
          name: nintendo-nes-compatible-apps
          path: |
            ci-apks/app-receiver-release.apk
            ci-apks/app-controller-release.apk
            assets/controller_icon.svg
            assets/controller_launcher_icon.xml
            assets/README.md
          if-no-files-found: error
          retention-days: 14
