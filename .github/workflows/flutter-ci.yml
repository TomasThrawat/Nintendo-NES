name: Shared Flutter CI

on:
  push:
    branches: ["main", "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-flutter-ci:
    name: Shared Flutter CI (pinned reusable workflow)
    uses: TomasThrawat/hyouka-flutter-workflows/.github/workflows/flutter-ci.yml@92cded954be5653a48fada29e926e4a3e4f402b7
    permissions:
      actions: read
      contents: read
      pull-requests: read
      id-token: write
      attestations: write
    with:
      flutter-channel: stable
      flutter-version: ""
      run-analyze: true
      run-tests: true
      run-screenshot-tests: true
      generate-coverage-report: true
      # The shared workflow builds one default APK. This project has two
      # product flavors, so the flavor-specific release builds below stay local.
      check-format: false
      build-apk: false
      target-platform: android-arm64
      generate-android: false
      android-project-name: nintendo_nes
      android-organization: com.tomastharwat
      run-emulator-tests: false
      emulator-api-level: 35
      run-security-audit: true
      fail-on-security-findings: false
      enable-targeted-pr-tests: false
      run-apk-smoke-test: false
      min-coverage-percent: 0
      max-apk-size-mb: 0
      max-apk-entry-size-mb: 0
      forbid-permissions: ""
      fail-on-new-warnings: false
      generate-artifact-attestation: false

  build-role-apks:
    name: Build and inspect receiver/controller APKs
    needs: [shared-flutter-ci]
    if: ${{ needs.shared-flutter-ci.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Show toolchain
        run: flutter --version

      - name: Generate Android files, permissions, and app roles
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            flutter create . --platforms=android --org=com.tomastharwat --project-name=nintendo_nes
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET" />'
          if permission not in content:
              content = re.sub(
                  r'(<manifest\b[^>]*>)',
                  r'\1\n    ' + permission,
                  content,
                  count=1,
              )
          content, count = re.subn(
              r'(android:label=")[^"]+(")',
              r'\1__APP_NAME_PLACEHOLDER__\2',
              content,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not make the launcher label flavor-specific.")
          if 'android.permission.INTERNET' not in content:
              raise SystemExit("Missing INTERNET permission needed for local UDP.")
          content = content.replace("__APP_NAME_PLACEHOLDER__", "${appName}")
          manifest.write_text(content)

          gradle = Path("android/app/build.gradle.kts")
          source = gradle.read_text()
          if 'create("receiver")' not in source:
              flavors = '''
              flavorDimensions += "role"
              productFlavors {
                  create("receiver") {
                      dimension = "role"
                      applicationId = "com.tomastharwat.nintendo_nes"
                      manifestPlaceholders["appName"] = "Nintendo NES Receiver"
                  }
                  create("controller") {
                      dimension = "role"
                      applicationId = "com.tomastharwat.nes_controller"
                      manifestPlaceholders["appName"] = "NES Wi-Fi Controller"
                  }
              }

          '''
              marker = "    buildTypes {"
              if marker not in source:
                  raise SystemExit("Could not locate Android buildTypes block for product flavors.")
              source = source.replace(marker, flavors + marker, 1)
              gradle.write_text(source)
          if 'create("receiver")' not in source or 'create("controller")' not in source:
              raise SystemExit("Missing receiver/controller Android product flavors.")
          PY

      - name: Resolve dependencies without upgrading constraints
        run: flutter pub get

      - name: Format Dart source as in the previous project workflow
        run: dart format lib test

      - name: Check whitespace errors
        run: git diff --check

      - name: Build receiver and controller arm64 APKs
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release --flavor receiver --target lib/main.dart --target-platform android-arm64 --no-pub
          flutter build apk --release --flavor controller --target lib/controller_main.dart --target-platform android-arm64 --no-pub
          test -s build/app/outputs/flutter-apk/app-receiver-release.apk
          test -s build/app/outputs/flutter-apk/app-controller-release.apk

      - name: Inspect both APKs
        shell: bash
        run: |
          set -euo pipefail
          sdk="$(printenv ANDROID_SDK_ROOT || printenv ANDROID_HOME || printf '%s' /usr/local/lib/android/sdk)"
          test -d "$sdk/build-tools"
          aapt="$(find "$sdk/build-tools" -type f -name aapt -perm -u+x | sort -V | tail -n 1)"
          if [ -z "$aapt" ]; then
            echo "Android SDK aapt was not found under $sdk/build-tools"
            find "$sdk/build-tools" -maxdepth 2 -type f -name 'aapt*' -print
            exit 1
          fi
          inspect_apk() {
            local apk="$1"
            local expected_id="$2"
            local expected_label="$3"
            test -s "$apk"
            python3 - "$apk" "$expected_id" "$expected_label" "$aapt" <<'PY'
          import re
          import subprocess
          import sys
          import zipfile

          apk_path, expected_id, expected_label, aapt = sys.argv[1:]
          with zipfile.ZipFile(apk_path) as archive:
              names = archive.namelist()
              native = sorted(n for n in names if n.startswith("lib/") and n.endswith(".so"))
              assert native, f"{apk_path}: APK has no native shared libraries"
              wrong = [n for n in native if not n.startswith("lib/arm64-v8a/")]
              assert not wrong, f"{apk_path}: unexpected native ABIs {wrong}"
              assert any(n.startswith("lib/arm64-v8a/") for n in native), f"{apk_path}: missing arm64-v8a libraries"

          badging = subprocess.run(
              [aapt, "dump", "badging", apk_path],
              check=True,
              text=True,
              capture_output=True,
          ).stdout
          package = re.search(r"^package: name='([^']+)'", badging, re.M)
          labels = re.findall(r"^application-label:'([^']*)'", badging, re.M)
          assert package and package.group(1) == expected_id, (
              f"{apk_path}: unexpected package ID {package.group(1) if package else None}"
          )
          assert expected_label in labels, (
              f"{apk_path}: expected label {expected_label!r}, got {labels}"
          )
          permissions = subprocess.run(
              [aapt, "dump", "permissions", apk_path],
              check=True,
              text=True,
              capture_output=True,
          ).stdout
          assert "android.permission.INTERNET" in permissions, (
              f"{apk_path}: missing INTERNET permission"
          )
          for forbidden in (
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.ACCESS_WIFI_STATE",
              "android.permission.NEARBY_WIFI_DEVICES",
          ):
              assert forbidden not in permissions, (
                  f"{apk_path}: unnecessary permission present: {forbidden}"
              )
          print(
              f"Verified {apk_path}: package={expected_id}, "
              f"label={expected_label}, ABI=arm64-v8a only"
          )
          print("Merged APK permissions:")
          print(permissions.strip())
          PY
            ls -lh "$apk"
          }
          inspect_apk "build/app/outputs/flutter-apk/app-receiver-release.apk" "com.tomastharwat.nintendo_nes" "Nintendo NES Receiver"
          inspect_apk "build/app/outputs/flutter-apk/app-controller-release.apk" "com.tomastharwat.nes_controller" "NES Wi-Fi Controller"

      - name: Upload receiver and controller APKs
        uses: actions/upload-artifact@v7
        with:
          name: nintendo-nes-arm64-apps
          path: |
            build/app/outputs/flutter-apk/app-receiver-release.apk
            build/app/outputs/flutter-apk/app-controller-release.apk
          if-no-files-found: error
          retention-days: 14
